name: room_capture
description: Single-owner AR camera capture for RoomScope.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: app.roomscope.capture
        pluginClass: RoomCapturePlugin
      ios:
        pluginClass: RoomCapturePlugin
