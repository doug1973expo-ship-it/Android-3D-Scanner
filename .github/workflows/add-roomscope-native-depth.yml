name: Add RoomScope Native Depth

on:
  push:
    branches:
      - roomscope-build
    paths:
      - '.github/workflows/add-roomscope-native-depth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roomscope-build
          fetch-depth: 0

      - name: Add supported-device ARCore depth sampling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('roomscope_src/plugins/room_capture/android/src/main/kotlin/app/roomscope/capture/RoomCapturePlugin.kt')
          text = path.read_text()

          old_config = '''                session = Session(host).also { created ->
                    created.configure(Config(created).apply {
                        focusMode = Config.FocusMode.AUTO
                        updateMode = Config.UpdateMode.LATEST_CAMERA_IMAGE
                    })
                }
'''
          new_config = '''                session = Session(host).also { created ->
                    val config = Config(created).apply {
                        focusMode = Config.FocusMode.AUTO
                        updateMode = Config.UpdateMode.LATEST_CAMERA_IMAGE
                    }
                    if (created.isDepthModeSupported(Config.DepthMode.AUTOMATIC)) {
                        config.depthMode = Config.DepthMode.AUTOMATIC
                    }
                    created.configure(config)
                }
'''
          if text.count(old_config) != 1:
              raise SystemExit('Expected ARCore session configuration block was not found exactly once')
          text = text.replace(old_config, new_config, 1)

          marker = '''                    var rgb: ByteArray? = null
'''
          depth = '''                    // Prefer ARCore's metric depth map when the device supports it.
                    // Values are millimetres along the camera principal axis; sample
                    // them into the same world coordinate system as tracked points.
                    if (current.isDepthModeSupported(Config.DepthMode.AUTOMATIC) &&
                        camera.trackingState == TrackingState.TRACKING) {
                        try {
                            frame.acquireDepthImage16Bits().use { depthImage ->
                                val depthPlane = depthImage.planes[0]
                                val depthBuffer = depthPlane.buffer.order(ByteOrder.LITTLE_ENDIAN)
                                val dfx = focal[0] * depthImage.width.toFloat() / dimensions[0]
                                val dfy = focal[1] * depthImage.height.toFloat() / dimensions[1]
                                val dcx = center[0] * depthImage.width.toFloat() / dimensions[0]
                                val dcy = center[1] * depthImage.height.toFloat() / dimensions[1]
                                val step = maxOf(2, minOf(depthImage.width, depthImage.height) / 60)
                                depthLoop@ for (v in step / 2 until depthImage.height step step) {
                                    for (u in step / 2 until depthImage.width step step) {
                                        if (points.size >= 18000) break@depthLoop
                                        val offset = v * depthPlane.rowStride + u * depthPlane.pixelStride
                                        if (offset < 0 || offset + 1 >= depthBuffer.limit()) continue
                                        val mm = depthBuffer.getShort(offset).toInt() and 0xffff
                                        if (mm !in 250..8000) continue
                                        val z = mm / 1000f
                                        val local = floatArrayOf(
                                            (u.toFloat() - dcx) * z / dfx,
                                            -(v.toFloat() - dcy) * z / dfy,
                                            -z
                                        )
                                        val world = camera.pose.transformPoint(local)
                                        points.addAll(world.map { it.toDouble() })
                                    }
                                }
                            }
                        } catch (_: NotYetAvailableException) {
                            // Depth normally needs several tracked frames before it is ready.
                        } catch (_: IllegalStateException) {
                            // Keep sparse tracking and MiDaS fallback active if depth drops out.
                        }
                    }

                    var rgb: ByteArray? = null
'''
          if text.count(marker) != 1:
              raise SystemExit('Expected RGB marker was not found exactly once')
          text = text.replace(marker, depth, 1)
          path.write_text(text)
          PY

      - name: Commit native depth upgrade
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roomscope_src/plugins/room_capture/android/src/main/kotlin/app/roomscope/capture/RoomCapturePlugin.kt
          git commit -m "Use ARCore metric depth for RoomScope mapping"
          git push origin HEAD:roomscope-build
