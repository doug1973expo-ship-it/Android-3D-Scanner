name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --stacktrace
      - name: Publish directly downloadable APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "Latest Pocket 3D Scanner APK" --notes "Automatic development build. Download app-debug.apk below."
